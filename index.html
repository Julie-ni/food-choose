<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>吃什麼？吃什麼？吃什麼？</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 40px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .food-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }
        .food-name {
            margin-top: 10px;
        }
        
        .fireworks {
        font-size: 50px;
        margin: 10px 0;
        animation: firework 0.8s ease-out;
    }

    @keyframes firework {
        0% {
            transform: scale(0.2);
            opacity: 0;
        }

        40% {
            transform: scale(1.4);
            opacity: 1;
        }

        70% {
            transform: scale(1);
            opacity: 1;
        }

        100% {
            transform: scale(1.3);
            opacity: 0;
        }
    }
    </style>
</head>

<body>

    <h1>吃什麼？吃什麼？吃什麼？</h1>

    <p>不知道吃什麼嗎？</p>

    <div id="result">手黑黑還是白白！？</div>

    <button onclick="chooseFood()">下好離手！</button>

    <script>

       const foods = [
    {
        name: "麥當勞",
        image: "MCDONALD.JPG"
    },
    {
        name: "義大利麵",
        image: "KIRINPASTA.JPG"
    },
    {
        name: "摩斯",
        image: "MOS.JPG"
    },
    {
        name: "丼飯",
        image: "SUKIYA.JPG"
    },
    {
        name: "健康餐",
        image: "GETPOWER.jpg"
    },
    {
        name: "水餃 / 鍋貼",
        image: "BAFANG.JPG"
    },
    {
        name: "炸雞",
        image: "21PLUS.JPG"
    },
    {
        name: "漢堡王",
        image: "BURGERKING.JPG"
    },
    {
        name: "肯德基",
        image: "KFC.JPG"
    },
    {
        name: "關東煮 / 甜不辣",
        image: "TWOFISH.JPG"
    },
    {
        name: "鑫吉野烤肉飯",
        image: "XINJIYE.JPG"
    },
    {
        name: "雞肉本家",
        image: "CHICKENBENJIA.JPG"
    },
    {
        name: "粽子",
        image: "ZHENPINJIURU.JPG"
    },
    {
        name: "牛肉麵",
        image: "579.JPG"
    },
    {
        name: "小樂天",
        image: "XIAOLETIAN.JPG"
    },
    {
        name: "烤肉飯",
        image: "KAOSHIFU.JPG"
    },
    {
        name: "米糕",
        image: "WEIJIA.JPG"
    },
    {
        name: "咖哩飯",
        image: "LANE30.JPG"
    },
    {
        name: "豆漿",
        image: "HONGJI.JPG"
    },
    {
        name: "傻瓜麵",
        image: "FOOL.JPG"
    },
    {
        name: "雞肉飯",
        image: "JIANHONG.JPG"
    },
    {
        name: "飯糰",
        image: "ONIGIRIPLANET.jpg"
    }
        ];
function chooseFood() {

    let count = 0;
    let delay = 40;

    function showRandomFood() {

        const randomIndex = Math.floor(Math.random() * foods.length);
        const food = foods[randomIndex];

        document.getElementById("result").innerHTML =
            '<img src="' + food.image + '" class="food-image">';

        count++;

        if (count < 15) {

            delay = delay + 10 + (count * 4);

            setTimeout(showRandomFood, delay);

        } else {

    document.getElementById("result").innerHTML =
        '<div class="fireworks">✦ ✧ ✦</div>' +
        '<img src="' + food.image + '" class="food-image">' +
        '<div class="food-name">' + food.name + '</div>' +
        '<div class="fireworks">✧ ✦ ✧</div>';
        }
    }

    showRandomFood();
}

    </script>

</body>
</html>
