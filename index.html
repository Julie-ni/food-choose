<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>要吃什麼咧？</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 40px;
        }

        button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: #e53935;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #b71c1c;
        }

button:active {
    transform: translateY(8px);
    box-shadow: 0 0 0 #b71c1c;
}
        .food-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }
        .food-name {
            margin-top: 10px;
        }
        
.fireworks {
    position: relative;
    width: 100%;
    height: 150px;
    margin-top: 10px;
    pointer-events: none;
    overflow: visible;
}

.firework {
    position: absolute;
    top: 50px;
    width: 8px;
    height: 8px;
    z-index: 10;
}

.firework.left {
    left: 22%;
}

.firework.right {
    right: 22%;
}

.spark {
    position: absolute;
    left: 0;
    top: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffd60a;
    box-shadow:
        0 0 6px #ffd60a,
        0 0 12px #ffd60a;
    animation: firework 1.5s ease-out forwards;
}

.firework.left .spark:nth-child(1) {
    --angle: -90deg;
    --distance: 65px;
}

.firework.left .spark:nth-child(2) {
    --angle: -65deg;
    --distance: 60px;
}

.firework.left .spark:nth-child(3) {
    --angle: -40deg;
    --distance: 70px;
}

.firework.left .spark:nth-child(4) {
    --angle: -15deg;
    --distance: 62px;
}

.firework.left .spark:nth-child(5) {
    --angle: 15deg;
    --distance: 65px;
}

.firework.left .spark:nth-child(6) {
    --angle: 40deg;
    --distance: 70px;
}

.firework.left .spark:nth-child(7) {
    --angle: 65deg;
    --distance: 60px;
}

.firework.left .spark:nth-child(8) {
    --angle: 90deg;
    --distance: 65px;
}

.firework.right .spark:nth-child(1) {
    --angle: -90deg;
    --distance: 65px;
}

.firework.right .spark:nth-child(2) {
    --angle: -65deg;
    --distance: 60px;
}

.firework.right .spark:nth-child(3) {
    --angle: -40deg;
    --distance: 70px;
}

.firework.right .spark:nth-child(4) {
    --angle: -15deg;
    --distance: 62px;
}

.firework.right .spark:nth-child(5) {
    --angle: 15deg;
    --distance: 65px;
}

.firework.right .spark:nth-child(6) {
    --angle: 40deg;
    --distance: 70px;
}

.firework.right .spark:nth-child(7) {
    --angle: 65deg;
    --distance: 60px;
}

.firework.right .spark:nth-child(8) {
    --angle: 90deg;
    --distance: 65px;
}

@keyframes firework {

    0% {
        opacity: 1;
        transform: rotate(var(--angle)) translateX(0) scale(1);
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: rotate(var(--angle)) translateX(var(--distance)) scale(0.2);
    }
}

    </style>
</head>

<body>

    <h1>要吃什麼咧？</h1>

    <div id="result">手黑黑還是白白！？</div>

    <button onclick="chooseFood()">START !</button>

    <script>

       const foods = [
    {
        name: "麥當勞",
        image: "MCDONALD.JPG"
    },
    {
        name: "義大利麵",
        image: "KIRINPASTA.JPG"
    },
    {
        name: "摩斯",
        image: "MOS.JPG"
    },
    {
        name: "丼飯",
        image: "SUKIYA.JPG"
    },
    {
        name: "健康餐",
        image: "GETPOWER.jpg"
    },
    {
        name: "水餃 / 鍋貼",
        image: "BAFANG.JPG"
    },
    {
        name: "炸雞",
        image: "21PLUS.JPG"
    },
    {
        name: "漢堡王",
        image: "BURGERKING.JPG"
    },
    {
        name: "肯德基",
        image: "KFC.JPG"
    },
    {

        image: "TWOFISH.JPG"
    },
    {
        name: "鑫吉野烤肉飯",
        image: "XINJIYE.JPG"
    },
    {
        name: "雞肉本家",
        image: "CHICKENBENJIA.JPG"
    },
    {
        name: "粽子",
        image: "ZHENPINJIURU.JPG"
    },
    {
        name: "牛肉麵",
        image: "579.JPG"
    },
    {

        image: "XIAOLETIAN.JPG"

    {

        image: "KAOSHIFU.JPG"

    {
        name: "米糕",
        image: "WEIJIA.JPG"
    },
    {
        name: "咖哩飯",
        image: "LANE30.JPG"
    },
    {
        name: "豆漿",
        image: "HONGJI.JPG"
    },
    {
        name: "傻瓜麵",
        image: "FOOL.JPG"
    },
    {
        name: "雞肉飯",
        image: "JIANHONG.JPG"
    },
    {
        name: "飯糰",
        image: "ONIGIRIPLANET.jpg"
    }
        ];

    foods.forEach(function(food) { const img = new Image(); img.src = food.image;
});

function chooseFood() {

    document.querySelector("button").style.visibility = "hidden";

    let count = 0;
    let delay = 40;

    function showRandomFood() {

        const randomIndex = Math.floor(Math.random() * foods.length);
        const food = foods[randomIndex];

        document.getElementById("result").innerHTML =
            '<img src="' + food.image + '" class="food-image">';

        count++;

        if (count < 15) {

            delay = delay + 10 + (count * 4);

            setTimeout(showRandomFood, delay);

        } else {

            setTimeout(function() {
            document.querySelector("button").style.visibility = "visible"; }, 1500);

            document.getElementById("result").innerHTML =
                '<img src="' + food.image + '" class="food-image">' +
                '<div class="food-name">' + food.name + '</div>' +
                '<div class="fireworks">' +
                '<div class="firework left">' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '</div>' +               
                '<div class="firework right">' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '<span class="spark"></span>' +
                '</div>' + '</div>';
        }
    }

    showRandomFood();
}

    </script>

</body>
</html>
