<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>要吃什麼咧？</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 410px;
        }

        button {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: #e53935;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #b71c1c;
            overflow: hidden;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow:
                inset 0 4px 8px rgba(255, 255, 255, 0.35),
                inset 0 -6px 10px rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        button {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #b71c1c;
            }
        .food-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }
        .food-name {
            margin-top: 10px;
        }
        
        .fireworks {
            position: relative;
            width: 100%;
            height: 180px;
            margin-top: 10px;
            overflow: visible;
            pointer-events: none;
        }
        
        .firework {
            position: absolute;
            top: 55px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: firework 1.5s ease-out forwards;
        }

        .firework.left {
            left: 22%;
            background: #ff3b30;
            box-shadow:
                0 -55px 0 #ffd60a,
                20px -50px 0 #ff9500,
                38px -35px 0 #ff2d55,
                52px -15px 0 #af52de,
                55px 5px 0 #5ac8fa,
                48px 25px 0 #00d4ff,
                30px 42px 0 #34c759,
                5px 52px 0 #ffd60a,
                -20px 48px 0 #ff9500,
                -40px 32px 0 #ff3b30,
                -52px 10px 0 #ff2d55,
                -50px -15px 0 #af52de,
                -35px -38px 0 #5ac8fa,
                -15px -52px 0 #00d4ff;
        }

        .firework.right {
            right: 22%;
            background: #00d4ff;
            box-shadow:
                0 -55px 0 #ff2d55,
                20px -50px 0 #af52de,
                38px -35px 0 #5ac8fa,
                52px -15px 0 #34c759,
                55px 5px 0 #ffd60a,
                48px 25px 0 #ff9500,
                30px 42px 0 #ff3b30,
                5px 52px 0 #ff2d55,
                -20px 48px 0 #af52de,
                -40px 32px 0 #5ac8fa,
                -52px 10px 0 #34c759,
                -50px -15px 0 #ffd60a,
                -35px -38px 0 #ff9500,
                -15px -52px 0 #ff3b30;
        }

        @keyframes firework {
        
            0% {
                transform: scale(0.1);
                opacity: 0;
            }
        
            15% {
                transform: scale(0.7);
                opacity: 1;
            }
        
            45% {
                transform: scale(1.15);
                opacity: 1;
            }
        
            65% {
                transform: scale(1.15);
                opacity: 0.9;
            }
        
            100% {
                transform: scale(1.15);
                opacity: 0;
            }
        }

    </style>    
</head>

<body>

    <h1>要吃什麼咧？</h1>

    <div id="result">手黑黑還是白白！？</div>

    <button onclick="chooseFood()">START !</button>

    <script>

       const foods = [
    {
        name: "麥當勞",
        image: "MCDONALD.JPG"
    },
    {
        name: "義大利麵",
        image: "KIRINPASTA.JPG"
    },
    {
        name: "摩斯",
        image: "MOS.JPG"
    },
    {
        name: "丼飯",
        image: "SUKIYA.JPG"
    },
    {
        name: "健康餐",
        image: "GETPOWER.jpg"
    },
    {
        name: "水餃 / 鍋貼",
        image: "BAFANG.JPG"
    },
    {
        name: "炸雞",
        image: "21PLUS.JPG"
    },
    {
        name: "漢堡王",
        image: "BURGERKING.JPG"
    },
    {
        name: "肯德基",
        image: "KFC.JPG"
    },
    {
        name: "關東煮 / 甜不辣",
        image: "TWOFISH.JPG"
    },
    {
        name: "鑫吉野烤肉飯",
        image: "XINJIYE.JPG"
    },
    {
        name: "雞肉本家",
        image: "CHICKENBENJIA.JPG"
    },
    {
        name: "粽子",
        image: "ZHENPINJIURU.JPG"
    },
    {
        name: "牛肉麵",
        image: "579.JPG"
    },
    {
        name: "小樂天",
        image: "XIAOLETIAN.JPG"
    },
    {
        name: "烤肉飯",
        image: "KAOSHIFU.JPG"
    },
    {
        name: "米糕",
        image: "WEIJIA.JPG"
    },
    {
        name: "咖哩飯",
        image: "LANE30.JPG"
    },
    {
        name: "豆漿",
        image: "HONGJI.JPG"
    },
    {
        name: "傻瓜麵",
        image: "FOOL.JPG"
    },
    {
        name: "雞肉飯",
        image: "JIANHONG.JPG"
    },
    {
        name: "飯糰",
        image: "ONIGIRIPLANET.jpg"
    }
        ];

    foods.forEach(function(food) { const img = new Image(); img.src = food.image;
});

function chooseFood() {

    document.querySelector("button").style.visibility = "hidden";

let count = 0;

const delays = [
    40, 45, 50, 55, 60,
    70, 80, 95, 115, 140,
    170, 205, 245, 290, 340
];
    function showRandomFood() {

        const randomIndex = Math.floor(Math.random() * foods.length);
        const food = foods[randomIndex];

        document.getElementById("result").innerHTML =
            '<img src="' + food.image + '" class="food-image">';

        count++;

        if (count < 15) {
        
            setTimeout(showRandomFood, delays[count -1]);
        
        } else {

            setTimeout(function() {
            document.querySelector("button").style.visibility = "visible"; }, 1500);

            document.getElementById("result").innerHTML =
                '<img src="' + food.image + '" class="food-image">' +
                '<div class="food-name">' + food.name + '</div>' +
                '<div class="fireworks">' +
                '<div class="firework left"></div>' +
                '<div class="firework right"></div>' +
                '</div>';
        }
    }

    showRandomFood();
}

    </script>

</body>
</html>
