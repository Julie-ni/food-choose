<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>今天吃什麼？</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 40px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🍽️ 今天吃什麼？</h1>

    <p>不知道吃什麼嗎？</p>

    <div id="result">按下按鈕決定！</div>

    <button onclick="chooseFood()">開始決定</button>

    <script>

       const foods = [
    {
        name: "牛肉麵",
        emoji: "🍜"
    },
    {
        name: "義大利麵",
        image: "KIRINPASTA.JPG"
    },
    {
        name: "漢堡",
        emoji: "🍔"
    },
    {
        name: "披薩",
        emoji: "🍕"
    },
    {
        name: "咖哩飯",
        emoji: "🍛"
    },
    {
        name: "水餃 / 鍋貼",
        image: "BAFANG.JPG"
    },
    {
        name: "炸雞",
        image: "21PLUS.JPG"
    },
    {
        name: "滷肉飯",
        emoji: "🍚"
    }
];
        function chooseFood() {
            const randomIndex = Math.floor(Math.random() * foods.length);

            const food = foods[randomIndex];

if (food.image) {
    document.getElementById("result").innerHTML =
        '<img src="' + food.image + '" width="60" style="vertical-align: middle; margin-right: 10px;">' +
        food.name;
} else {
    document.getElementById("result").textContent =
        food.emoji + " " + food.name;
}
        }

    </script>

</body>
</html>
