<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>要吃什麼咧？</title>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        #result {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 40px;
        }

        button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: #e53935;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        
            box-shadow: 0 8px 0 #b71c1c;
        }

button:active {
    transform: translateY(8px);
    box-shadow: 0 0 0 #b71c1c;
}
        .food-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
        }
        .food-name {
            margin-top: 10px;
        }
        
.fireworks {
    position: relative;
    width: 220px;
    height: 80px;
    margin: 0 auto;
    pointer-events: none;
}

.firework-burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 -45px 0 #ff3b30,
        0 45px 0 #ffd60a,
        45px 0 0 #34c759,
        -45px 0 0 #0a84ff,
        32px -32px 0 #af52de,
        -32px -32px 0 #ff9500,
        32px 32px 0 #ff2d55,
        -32px 32px 0 #5ac8fa;
    animation: burst 0.9s ease-out forwards;
}

@keyframes burst {
    0% {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0;
    }

    15% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 1;
    }

    55% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(2.2);
        opacity: 0;
    }
}
    </style>
</head>

<body>

    <h1>要吃什麼咧？</h1>

    <div id="result">手黑黑還是白白！？</div>

    <button onclick="chooseFood()">START!</button>

    <script>

       const foods = [
    {
        name: "麥當勞",
        image: "MCDONALD.JPG"
    },
    {
        name: "義大利麵",
        image: "KIRINPASTA.JPG"
    },
    {
        name: "摩斯",
        image: "MOS.JPG"
    },
    {
        name: "丼飯",
        image: "SUKIYA.JPG"
    },
    {
        name: "健康餐",
        image: "GETPOWER.jpg"
    },
    {
        name: "水餃 / 鍋貼",
        image: "BAFANG.JPG"
    },
    {
        name: "炸雞",
        image: "21PLUS.JPG"
    },
    {
        name: "漢堡王",
        image: "BURGERKING.JPG"
    },
    {
        name: "肯德基",
        image: "KFC.JPG"
    },
    {
        name: "關東煮 / 甜不辣",
        image: "TWOFISH.JPG"
    },
    {
        name: "鑫吉野烤肉飯",
        image: "XINJIYE.JPG"
    },
    {
        name: "雞肉本家",
        image: "CHICKENBENJIA.JPG"
    },
    {
        name: "粽子",
        image: "ZHENPINJIURU.JPG"
    },
    {
        name: "牛肉麵",
        image: "579.JPG"
    },
    {
        name: "小樂天",
        image: "XIAOLETIAN.JPG"
    },
    {
        name: "烤肉飯",
        image: "KAOSHIFU.JPG"
    },
    {
        name: "米糕",
        image: "WEIJIA.JPG"
    },
    {
        name: "咖哩飯",
        image: "LANE30.JPG"
    },
    {
        name: "豆漿",
        image: "HONGJI.JPG"
    },
    {
        name: "傻瓜麵",
        image: "FOOL.JPG"
    },
    {
        name: "雞肉飯",
        image: "JIANHONG.JPG"
    },
    {
        name: "飯糰",
        image: "ONIGIRIPLANET.jpg"
    }
        ];
function chooseFood() {

    let count = 0;
    let delay = 40;

    function showRandomFood() {

        const randomIndex = Math.floor(Math.random() * foods.length);
        const food = foods[randomIndex];

        document.getElementById("result").innerHTML =
            '<img src="' + food.image + '" class="food-image">';

        count++;

        if (count < 15) {

            delay = delay + 10 + (count * 4);

            setTimeout(showRandomFood, delay);

        } else {

            document.getElementById("result").innerHTML =
                '<div class="fireworks"><div class="firework-burst"></div></div>' +
                '<img src="' + food.image + '" class="food-image">' +
                '<div class="food-name">' + food.name + '</div>' +
                '<div class="fireworks"><div class="firework-burst"></div></div>';
        }
    }

    showRandomFood();
}

    </script>

</body>
</html>
