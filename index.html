<!DOCTYPE html> <html lang="zh-Hant"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>今天吃什麼？</title> <style> body { font-family: sans-serif; text-align: center; padding: 40px 20px; } h1 { font-size: 32px; } #result { font-size: 28px; font-weight: bold; margin: 40px 0; min-height: 40px; } button { font-size: 20px; padding: 15px 30px; border: none; border-radius: 12px; cursor: pointer; } </style> </head> <body> <h1>🍽️ 今天吃什麼？</h1> <p>不知道吃什麼嗎？</p> <div id="result">按下按鈕決定！</div> <button onclick="chooseFood()">開始決定</button> <script> const foods = [ "🍜 牛肉麵", "🍣 壽司", "🍔 漢堡", "🍕 披薩", "🍛 咖哩飯", "🥟 水餃", "🍗 炸雞", "🍚 滷肉飯" ]; function chooseFood() { const randomIndex = Math.floor(Math.random() * foods.length); document.getElementById("result").textContent = foods[randomIndex]; } </script> </body> </html>
